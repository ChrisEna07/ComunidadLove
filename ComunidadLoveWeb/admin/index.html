<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="CLGestión - Sistema integral de gestión de Comunidad Love">
  <title>CLGestión | Comunidad Love</title>

  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#ff6b4a">
  <link rel="apple-touch-icon" href="../favicon.png">

  <!-- Stylesheet exclusivo del panel. No toca la landing pública. -->
  <link rel="stylesheet" href="./admin.css">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK v10+ modular (sin build step) -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
</head>
<body class="clg-body">

  <div class="clg-app" id="clg-app">
    <div class="clg-boot">
      <div class="clg-boot-card">
        <div class="clg-heart-pulse-box">
          <img src="../Assets/logo-color.png" alt="Comunidad Love" class="clg-heart-pulse-logo" onerror="this.style.display='none'">
        </div>
        <h1>CLGestión</h1>
        <p>Cargando el sistema…</p>
      </div>
    </div>
  </div>

  <div class="clg-toast-host" id="clg-toast-host" aria-live="polite"></div>

  <script type="module" src="../js/admin/main.js"></script>
  <script>
    // Salvaguarda: si tras 4 segundos la aplicación no ha podido montar (ej. error 404 de importación)
    setTimeout(function() {
      var root = document.getElementById('clg-app');
      var p = root ? root.querySelector('.clg-boot p') : null;
      if (p && p.textContent.includes('Cargando el sistema')) {
        root.innerHTML = `
          <div class="clg-boot">
            <div class="clg-boot-card" style="max-width: 500px; text-align: left; padding: 30px;">
              <div style="text-align: center; margin-bottom: 16px;">
                <i class="fas fa-triangle-exclamation" style="color: #ff6b4a; font-size: 2.5rem; margin-bottom: 12px; display: inline-block;"></i>
                <h1 style="font-size: 1.4rem; color: #1e293b;">No se pudo conectar a Firebase</h1>
                <p style="font-size: 0.88rem; color: #64748b; margin-top: 6px;">El panel no pudo cargar las credenciales del servidor.</p>
              </div>
              <div style="background: rgba(255, 107, 74, 0.08); border-radius: 10px; padding: 14px; font-size: 0.82rem; color: #334155; line-height: 1.5; margin-bottom: 20px;">
                En Vercel, el archivo <code>js/firebase-config.js</code> no está subido porque está protegido en <code>.gitignore</code>.
              </div>
              <div style="display: flex; gap: 10px; justify-content: space-between;">
                <a href="../index.html" class="clg-btn clg-btn-ghost" style="text-decoration:none;"><i class="fas fa-arrow-left"></i><span>Sitio público</span></a>
                <button type="button" class="clg-btn clg-btn-primary" onclick="location.reload()"><i class="fas fa-rotate"></i><span>Reintentar</span></button>
              </div>
            </div>
          </div>
        `;
      }
    }, 4000);
  </script>
</body>
</html>
