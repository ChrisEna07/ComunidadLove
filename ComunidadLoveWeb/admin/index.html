<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="CLGestión - Sistema integral de gestión de Comunidad Love">
  <title>CLGestión | Comunidad Love</title>

  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#ff6b4a">
  <link rel="apple-touch-icon" href="../favicon.png">

  <!-- Estilos críticos para el loader inicial (evita desborde de imagen y saltos de layout) -->
  <style>
    .initial-loader, .clg-heart-pulse-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .initial-loader img, .clg-heart-pulse-logo {
      width: 140px;
      height: auto;
      max-width: 80vw;
      object-fit: contain;
      display: block;
      margin: 0 auto 1rem;
    }
    .clg-boot {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdfbf7;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .clg-boot-card {
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
      padding: 44px 40px;
      max-width: 460px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
  </style>

  <!-- Stylesheet exclusivo del panel. No toca la landing pública. -->
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="./admin.css">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK v10+ modular (sin build step) -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
</head>
<body class="clg-body">

  <div class="clg-app" id="clg-app">
    <div class="clg-boot">
      <div class="clg-boot-card initial-loader">
        <div class="clg-heart-pulse-box">
          <img src="../Assets/logo-color.png" alt="Comunidad Love" class="clg-heart-pulse-logo" onerror="this.style.display='none'">
        </div>
        <h1>CLGestión</h1>
        <p>Cargando el sistema…</p>
      </div>
    </div>
  </div>

  <div class="clg-toast-host" id="clg-toast-host" aria-live="polite"></div>

  <script type="module" src="../js/admin/main.js"></script>
</body>
</html>
